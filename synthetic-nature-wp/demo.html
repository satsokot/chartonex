<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthetic Nature – Demo</title>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/2bf40ab72ea4897a3fd9b6e48b233a19?family=Garamond">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #fff;
      background: #010101;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sn-wrapper { position: relative; min-height: 100vh; overflow: hidden; background: #010101; }

    /* VIDEO */
    .sn-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .sn-video-bg video { width: 100%; height: 100%; object-fit: cover; object-position: center; }

    /* NAV */
    .sn-nav {
      position: relative; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 1.5rem;
    }
    @media (min-width: 768px) { .sn-nav { justify-content: center; padding: 2rem 2.5rem; } }

    .sn-brand {
      color: #fff; text-transform: uppercase; font-weight: 300;
      font-size: .875rem; letter-spacing: .25em; text-decoration: none;
    }
    @media (min-width: 768px) { .sn-brand { position: absolute; left: 2.5rem; font-size: 1rem; letter-spacing: .3em; } }

    .sn-nav-links { display: none; list-style: none; gap: 2.5rem; margin: 0; padding: 0; }
    @media (min-width: 768px) { .sn-nav-links { display: flex; align-items: center; } }
    .sn-nav-links a { color: rgba(255,255,255,.8); text-decoration: none; text-transform: uppercase; font-size: .75rem; letter-spacing: .2em; transition: color .3s; }
    .sn-nav-links a:hover { color: #fff; }

    /* HAMBURGER */
    .sn-hamburger { display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: #fff; cursor: pointer; padding: .25rem; }
    @media (min-width: 768px) { .sn-hamburger { display: none; } }
    .sn-hamburger svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* MOBILE MENU */
    .sn-mobile-menu {
      position: fixed; top: 4rem; left: 1rem; right: 1rem; z-index: 50;
      display: none;
      background: rgba(10,10,10,.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
      border-radius: 1rem; padding: 2rem 1rem;
    }
    .sn-mobile-menu.is-open { display: block; animation: menuFadeIn .3s ease-out; }
    @keyframes menuFadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
    .sn-mobile-menu ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:1.25rem; }
    .sn-mobile-menu a { color:rgba(255,255,255,.9); text-decoration:none; text-transform:uppercase; font-weight:300; letter-spacing:.25em; font-size:.875rem; transition:color .2s; }
    .sn-mobile-menu a:hover { color:#fff; }

    /* HERO */
    .sn-hero { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:100vh; padding:3rem 1.25rem 2rem; }
    @media (min-width:640px)  { .sn-hero { padding:4rem 2rem 2rem; } }
    @media (min-width:768px)  { .sn-hero { padding:6rem 2rem 2rem; } }

    /* TITLE */
    .sn-title { font-family:'Garamond','Times New Roman',serif; font-weight:400; color:#fff; font-size:clamp(2.5rem,10vw,7rem); line-height:1.08; letter-spacing:-.02em; margin-bottom:1.5rem; }
    @media (min-width:640px) { .sn-title { margin-bottom:2rem; } }
    .sn-title .line { display:block; }
    .sn-char { display:inline-block; opacity:0; animation:charFadeIn .4s ease forwards; }
    .sn-char.space { white-space:pre; }
    @keyframes charFadeIn { from{opacity:0} to{opacity:1} }

    /* SUBTITLE */
    .sn-subtitle { color:rgba(255,255,255,.7); font-weight:300; line-height:1.6; font-size:.875rem; max-width:20rem; margin-bottom:2rem; opacity:0; animation:fadeUp .8s ease 1.6s forwards; }
    @media (min-width:640px) { .sn-subtitle { font-size:1rem; max-width:28rem; margin-bottom:2.5rem; } }
    @media (min-width:1024px) { .sn-subtitle { font-size:1.125rem; } }

    /* CTA */
    .sn-cta {
      background:rgba(255,255,255,.01); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      border:none; box-shadow:inset 0 1px 1px rgba(255,255,255,.1);
      border-radius:9999px; padding:.875rem 1.75rem;
      color:rgba(255,255,255,.9); text-transform:uppercase; font-size:.75rem; letter-spacing:.18em;
      cursor:pointer; text-decoration:none; display:inline-block;
      position:relative; overflow:hidden;
      opacity:0; animation:fadeUp .8s ease 2.0s forwards; font-family:inherit;
    }
    @media (min-width:640px) { .sn-cta { padding:1rem 2.5rem; font-size:.875rem; letter-spacing:.2em; } }
    .sn-cta::before {
      content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
      background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }
    .sn-cta:hover { background:rgba(255,255,255,.04); box-shadow:inset 0 1px 2px rgba(255,255,255,.15); }
    .sn-cta:active { transform:scale(.98); }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div class="sn-wrapper">

  <!-- VIDEO -->
  <div class="sn-video-bg" aria-hidden="true">
    <video autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260619_191346_9d19d66e-86a4-47f7-8dc6-712c1788c3b2.mp4" type="video/mp4">
    </video>
  </div>

  <!-- NAV -->
  <nav class="sn-nav">
    <a href="#" class="sn-brand">Chartonex</a>

    <ul class="sn-nav-links">
      <li><a href="#">خانه</a></li>
      <li><a href="#">بازارها</a></li>
      <li><a href="#">آموزش</a></li>
      <li><a href="#">تماس</a></li>
    </ul>

    <button id="sn-hamburger" class="sn-hamburger" aria-expanded="false" aria-label="باز کردن منو">
      <svg id="sn-icon-menu" viewBox="0 0 24 24">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg id="sn-icon-close" viewBox="0 0 24 24" style="display:none">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6"  y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </nav>

  <!-- MOBILE MENU -->
  <div id="sn-mobile-menu" class="sn-mobile-menu">
    <ul>
      <li><a href="#">خانه</a></li>
      <li><a href="#">بازارها</a></li>
      <li><a href="#">آموزش</a></li>
      <li><a href="#">تماس</a></li>
    </ul>
  </div>

  <!-- HERO -->
  <main class="sn-hero">
    <h1 class="sn-title">
      <span class="line" data-text="WITNESS THE"></span>
      <span class="line" data-text="HIDDEN REALM"></span>
    </h1>
    <p class="sn-subtitle">
      سفری در دل بازارهای مالی،<br>
      روشن‌شده با داده و تحلیل.
    </p>
    <a href="#" class="sn-cta">شروع کن</a>
  </main>

</div>

<script>
(function(){
  // Hamburger
  var btn=document.getElementById('sn-hamburger'),
      menu=document.getElementById('sn-mobile-menu'),
      ico=document.getElementById('sn-icon-menu'),
      icx=document.getElementById('sn-icon-close');
  if(btn&&menu){
    btn.addEventListener('click',function(){
      var open=menu.classList.toggle('is-open');
      ico.style.display=open?'none':'block';
      icx.style.display=open?'block':'none';
      btn.setAttribute('aria-expanded',open);
    });
    menu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click',function(){
        menu.classList.remove('is-open');
        ico.style.display='block'; icx.style.display='none';
        btn.setAttribute('aria-expanded','false');
      });
    });
  }

  // Staggered char animation
  var el=document.querySelector('.sn-title');
  if(el){
    var lines=el.querySelectorAll('.line'), gi=0;
    lines.forEach(function(line){
      var text=line.getAttribute('data-text')||'';
      line.innerHTML='';
      for(var i=0;i<text.length;i++){
        var s=document.createElement('span');
        s.className='sn-char'+(text[i]===' '?' space':'');
        s.textContent=text[i];
        s.style.animationDelay=(gi*0.07)+'s';
        line.appendChild(s); gi++;
      }
    });
  }
})();
</script>
</body>
</html>
